# Runner Configuration for MVP Quota Management
runner_config:
  # Max searches per day (Free Tier Limit: ~100 searches/day = 10,000 units)
  # Recommended safe limit to allow room for errors and pagination: 25-30
  daily_search_limit: 25
  
  # Max results returned per search request (YouTube API max is 50)
  max_results_per_request: 50
  
  # Filter settings for the script
  filters:
    min_duration_seconds: 300   # 5 minutes minimum to ensure surgical depth
    max_duration_seconds: 2700  # 45 minutes maximum to avoid long conferences
    language_code: "en"         # English only
