
services:
  # --- Redis Service ---
  redis:
    image: redis:7-alpine
    container_name: ortho_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # Enable persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- RabbitMQ Service (with Management UI) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ortho_rabbitmq
    ports:
      - "5672:5672"   # AMQP Protocol Port
      - "15672:15672" # Management UI Port (Web Interface)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Qdrant Service (Your existing setup) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ortho_qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (Optional but recommended for performance)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:
  qdrant_storage:
